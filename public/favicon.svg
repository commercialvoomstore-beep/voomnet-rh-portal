<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="8"/>

  <!-- V Shape with HR / Tech Node accents -->
  <g filter="url(#glow)">
    <!-- Left leg of V -->
    <path d="M 110 120 L 210 120 L 256 370 L 195 370 Z" fill="url(#vGrad)"/>
    <!-- Right leg of V -->
    <path d="M 402 120 L 302 120 L 256 370 L 317 370 Z" fill="url(#vGrad)"/>
    <!-- Center HR Connection Core -->
    <circle cx="256" cy="180" r="36" fill="#ffffff"/>
    <circle cx="256" cy="180" r="24" fill="#0284c7"/>
    <!-- Side nodes -->
    <circle cx="160" cy="120" r="20" fill="#38bdf8"/>
    <circle cx="352" cy="120" r="20" fill="#c084fc"/>
    <circle cx="256" cy="385" r="24" fill="#38bdf8"/>
  </g>

  <!-- Pulse Arc -->
  <path d="M 160 120 Q 256 220 352 120" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
</svg>
