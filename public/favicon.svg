<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Container for browser tab contrast -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="6" filter="url(#shadow)"/>

  <!-- 2x2 VOOMNET Emblem Grid -->
  <g transform="translate(76, 76)">
    <!-- Top-Left Square (Deep Navy Blue) -->
    <g>
      <rect x="0" y="0" width="168" height="168" rx="36" fill="#0b0b61"/>
      <rect x="116" y="0" width="18" height="168" fill="#ffffff"/>
    </g>

    <!-- Top-Right Square (Violet Purple) -->
    <g>
      <rect x="192" y="0" width="168" height="168" rx="36" fill="#6a0dad"/>
      <rect x="226" y="0" width="18" height="168" fill="#ffffff"/>
    </g>

    <!-- Bottom-Left Square (Violet Purple) -->
    <g>
      <rect x="0" y="192" width="168" height="168" rx="36" fill="#6a0dad"/>
      <rect x="34" y="192" width="18" height="168" fill="#ffffff"/>
    </g>

    <!-- Bottom-Right Square (Deep Navy Blue) -->
    <g>
      <rect x="192" y="192" width="168" height="168" rx="36" fill="#0b0b61"/>
      <rect x="308" y="192" width="18" height="168" fill="#ffffff"/>
    </g>
  </g>
</svg>
